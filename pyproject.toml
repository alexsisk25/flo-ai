[project]
name = "walnut"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "flask>=3.1.3",
    "faster-whisper>=1.1.0",
    "numpy>=2.4.6",
    "pynput>=1.8.2",
    "rumps>=0.4.0",
    "sounddevice>=0.5.5",
    "soundfile>=0.14.0",
]

[tool.uv]
# Force resolution to versions with Intel Mac wheels (onnxruntime etc.).
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
