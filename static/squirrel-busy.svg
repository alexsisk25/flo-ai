<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <!-- tail: thick stroke sweeping up from rump, curling forward toward head -->
  <path d="M19 29.5 C 28.5 27.5 31.5 20.5 30.8 13.5 C 30.2 7.2 24.5 3.4 18.5 5.6"
        fill="none" stroke="black" stroke-width="6.6" stroke-linecap="round"/>
  <!-- body (hunched) -->
  <ellipse cx="13.5" cy="24.8" rx="8.2" ry="8.7" fill="black"/>
  <!-- head + snout -->
  <circle cx="9" cy="13.5" r="5.6" fill="black"/>
  <circle cx="4.3" cy="16" r="2.4" fill="black"/>
  <!-- ear -->
  <path d="M12 5 L14.2 10.3 L8.6 9.6 Z" fill="black"/>
  <!-- feet -->
  <rect x="6.5" y="31.2" width="13" height="3" rx="1.5" fill="black"/>
<circle cx="22" cy="17" r="3.6" fill="none" stroke="black" stroke-width="2"/></svg>
