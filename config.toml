# Flo configuration.
#
# Read ONCE, on first run, to seed flo.db. After that everything lives in
# the dashboard at http://127.0.0.1:8765 and changes apply live.
# (To start over: delete flo.db and restart Flo.)
#
# Flo ships blank on purpose. The examples below are commented out —
# uncomment them, or just add your own from the dashboard.

[hotkeys]
speak = "<alt>+s"    # narrate selected text: Right Option + S (press again to stop)
# Dictation is PUSH-TO-TALK: HOLD the Right Option key, speak, release to type.
# It's a held key, not a combo, so it isn't configured here.

[tts]
voice = ""   # empty = system default; run `say -v '?'` to list voices
rate = 210   # words per minute (say's default is ~175)

[stt]
# Leave both empty and Flo fits itself to your Mac:
#   Apple Silicon -> mlx-whisper on the GPU, large-v3-turbo
#   Intel         -> faster-whisper on the CPU, small.en
# Override the model with any id from the Settings page (e.g. "small.en"),
# or pin the engine with backend = "mlx" / "faster-whisper".
model = ""
backend = ""
language = "en"

[vocabulary]
# Names, acronyms, and jargon Whisper should recognise. These are fed to the
# model as hints and rescue proper nouns on the smaller models.
hints = []
# hints = ["Kubernetes", "Postgres", "Anthropic", "SKU"]

[replacements]
# Transcript fix-ups, applied case-insensitively.
# "hub spot" = "HubSpot"
# "git hub" = "GitHub"

[snippets]
# Say the trigger phrase exactly, and Flo types the expansion instead.
# "insert my email" = "you@example.com"
# "insert sign off" = "Best,\nYour Name"
